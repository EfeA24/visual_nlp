model_name: reader

input:
  color: true
  target_height: 32
  max_width: 512
  keep_aspect: true
  pad_value: 0
  pad_side: right

patch:
  height: 16
  width: 8

encoder:
  d_model: 256
  n_heads: 8
  n_layers: 4
  d_ff: 1024
  dropout: 0.1
  activation: gelu

decoder:
  d_model: 256
  n_heads: 8
  n_layers: 4
  d_ff: 1024
  dropout: 0.1
  activation: gelu
  max_output_length: 128

tokenizer:
  path: configs/vocabs/reader_charset.json
  unk_policy: unk

data:
  train_manifest: data/splits/reader_train.jsonl
  val_manifest: data/splits/reader_val.jsonl
  augment: true

train:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: adamw
  scheduler: cosine
  warmup_steps: 200
  max_epochs: 20
  grad_clip: 1.0
  mixed_precision: false
  grad_accum: 1
  num_workers: 0
  seed: 42
  device: cuda
  allow_cpu_fallback: true
  decode_every_epochs: 1
  max_decode_samples: 64

checkpoint:
  dir: outputs/checkpoints/reader
  save_every: 1
  best_metric: cer
  best_mode: min

decode:
  strategy: greedy
  beam_size: 5
  max_length: 128
